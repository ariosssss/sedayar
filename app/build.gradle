plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sedayar.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.sedayar.app"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "1.4.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'

    // Room database (local note storage)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Vosk: offline speech recognition for audio files (Persian model, no API key)
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // OkHttp: Whisper-compatible API + LLM summary requests
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JVM unit tests: the audio pipeline's pure-Java parts run and get
    // verified on every build (CI included)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
